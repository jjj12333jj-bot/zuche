server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: zuche-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zuche?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  # 手写 SQL 放在 resources/mapper 下，按模块分目录
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL：由 slf4j 输出，避免 StdOut 污染控制台
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：secret 必须 >= 32 字节（HS256 要求 256 位）
jwt:
  secret: zuche-credit-risk-control-platform-jwt-secret-key-2026
  expire-hours: 24

knife4j:
  enable: true
  setting:
    language: zh_cn

# 风控任务：默认每天 01:00 扫描逾期订单
# cron 六位：秒 分 时 日 月 周；本地演示想改成每 5 分钟可写 0 */5 * * * ?
zuche:
  risk:
    scan-cron: 0 0 1 * * ?

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true

logging:
  level:
    root: info
    com.zuche: debug
